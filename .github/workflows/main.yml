name: Rust build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cargo:
    name: Cargo and clean-source verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 \
            libstartup-notification0-dev \
            libxcb1-dev libxcb-xkb-dev libxcb-xinerama0-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-util0-dev libxcb-cursor-dev \
            libxcb-keysyms1-dev libxcb-icccm4-dev libxcb-xrm-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libyajl-dev libpcre2-dev libcairo2-dev libpango1.0-dev \
            libglib2.0-dev libev-dev
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Build debug binaries
        run: cargo build --workspace --locked
      - name: Build release binaries
        run: cargo build --workspace --locked --release
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Verify clean standalone build
        run: python3 scripts/test-cargo-build.py --offline
