[workspace]
resolver = "2"
members = [
    "crates/i3",
    "crates/i3-common",
    "crates/i3bar",
    "crates/i3-tools",
    "crates/i3-build",
]

[workspace.package]
version = "4.25.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/sdfgeoff/i333"

[workspace.dependencies]
libc = "=0.2.191"
c2rust-bitfields = "=0.22.1"
pkg-config = "=0.3.34"
i3-common = { path = "crates/i3-common" }
i3-build = { path = "crates/i3-build" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
