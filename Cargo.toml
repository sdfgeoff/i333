[workspace]
resolver = "2"
members = [
    "crates/i3",
    "crates/i3-common",
    "crates/i3bar",
    "crates/i3-tools",
    "crates/i3-build",
    "crates/i3-json",
    "crates/libev-sys",
    "crates/xcb-sys",
    "crates/startup-notification-sys",
]

[workspace.package]
version = "4.25.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/sdfgeoff/i333"

[workspace.dependencies]
libc = "=0.2.191"
c2rust-bitfields = "=0.22.1"
pkg-config = "=0.3.34"
i3-common = { path = "crates/i3-common" }
i3-build = { path = "crates/i3-build" }
i3-json = { path = "crates/i3-json" }
serde = "=1.0.229"
serde_json = "=1.0.154"
x11rb = "=0.13.2"
pcre2 = "=0.2.11"
libev-sys = { path = "crates/libev-sys" }
xcb-sys = { path = "crates/xcb-sys" }
startup-notification-sys = { path = "crates/startup-notification-sys" }
xcb = { version = "=1.7.1", default-features = false }
as-raw-xcb-connection = "=1.0.1"
xkbcommon = { version = "=0.9.0", default-features = false, features = ["x11"] }
cairo-sys = { package = "cairo-sys-rs", version = "=0.21.5", features = ["xcb"] }
pango-sys = "=0.21.5"
pangocairo-sys = "=0.21.5"
gobject-sys = "=0.21.5"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
