[workspace]
resolver = "2"
members = [
    "crates/i3",
    "crates/i3-common",
    "crates/i3bar",
    "crates/i3-tools",
    "crates/i3-build",
    "crates/i3-test-support",
    "crates/libev-sys",
    "crates/xcb-interop",
    "crates/startup-notification-sys",
]

[workspace.package]
version = "4.25.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/sdfgeoff/i333"

[workspace.dependencies]
bitflags = "=2.13.2"
libc = "=0.2.191"
log = "=0.4.34"
pkg-config = "=0.3.34"
i3-common = { path = "crates/i3-common" }
i3-build = { path = "crates/i3-build" }
i3-test-support = { path = "crates/i3-test-support" }
serde = "=1.0.229"
serde_json = "=1.0.154"
x11rb = "=0.13.2"
xkeysym = "=0.2.1"
pcre2 = "=0.2.11"
libev-sys = { path = "crates/libev-sys" }
xcb-interop = { path = "crates/xcb-interop" }
startup-notification-sys = { path = "crates/startup-notification-sys" }
xcb = { version = "=1.7.1", default-features = false, features = ["randr", "xinerama", "xkb", "shape"] }
xkbcommon = { version = "=0.9.0", default-features = false, features = ["x11"] }
cairo = { package = "cairo-rs", version = "=0.21.5", default-features = false }
cairo-sys = { package = "cairo-sys-rs", version = "=0.21.5", features = ["xcb"] }
pango = "=0.21.5"
pangocairo = "=0.21.5"
glib = "=0.21.5"
pango-sys = "=0.21.5"
pangocairo-sys = "=0.21.5"
gobject-sys = "=0.21.5"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
