[package]
name = "i3-common"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
log.workspace = true
xcb-interop.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision", "raw_value", "unbounded_depth"] }
xcb.workspace = true
libc.workspace = true
cairo.workspace = true
cairo-sys.workspace = true
pango.workspace = true
pangocairo.workspace = true
glib.workspace = true
pango-sys.workspace = true
pangocairo-sys.workspace = true
gobject-sys.workspace = true

[build-dependencies]
i3-build.workspace = true

[dev-dependencies]
x11rb = { workspace = true, features = ["xtest"] }
i3-test-support.workspace = true

[[test]]
name = "variadic_compat"
path = "tests/variadic_compat.rs"
harness = false

[[test]]
name = "native_json_oracle"
path = "tests/native_json_oracle.rs"
harness = false
